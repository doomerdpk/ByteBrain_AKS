apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-secretproviderclass-manager
  namespace: backend
rules:
- apiGroups:
  - secrets-store.csi.x-k8s.io
  resources:
  - secretproviderclasses
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-secretproviderclass-manager
  namespace: backend
subjects:
- kind: ServiceAccount
  name: flux-applier
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-secretproviderclass-manager